# Spatial selection example. Thresholds demonstrate mechanics, not validated privacy.
# Run from this directory with ../../build/Simulator. Output remains internal research data.
version: 1.0
display:
  width: 1100
  height: 850
  pixels_per_meter: 8
  title: 'UMP Spatial Aggregation - G toggles overlay'
renderer:
  show_renderer: true
  show_aggregation: true
  buffer_capacity: 128
  show_obstacles: false
  show_corridors: false
  show_trajectories: false
  show_waypoints: false
  show_arrow: true
  show_buffer: true
  show_info: false
  show_grids: true
  show_sensors: true
  show_text: false
simulation:
  width: 80
  height: 80
  duration_seconds: 30
  time_step: 0.05
  playback_speed: 0.5
  datetime: '2026-10-14T10:30:00'
collision:
  grid:
    cell_size: 20
    show_grid: false
agents:
  num_agents: 200
  waypoint_distance: 10
  waypoint_radius: 2
  road_user_taxonomy:
    - type: Adult Pedestrian
      probability: 1.0
      priority: 3
      radius: 0.25
      color: blue
      velocity:
        min: 1.0
        max: 1.667
        mu: 1.4
        sigma: 0.2
        noise_scale: 0.05
        noise_factor: 0.5
      acceleration:
        min: 0.68
        max: 1.44
      look_ahead_time: 2.0
database:
  host: localhost
  port: 27017
  db_name: UMP_SpatialSelection_Demo
  collection_name: Agents
  clear_database: false
sensors:
  - id: spatial-demo-agbs
    type: adaptive-grid-based
    frame_rate: 10.0
    detection_area:
      x: 0.0
      y: 0.0
      width: 80.0
      height: 80.0
      color: blue
      alpha: 0.1
    grid:
      cell_size: 40
      max_depth: 6
      show_grid: true
    database:
      db_name: UMP_SpatialSelection_Demo
      collection_name: AGB_Sensor_Data_V3
    aggregation:
      enabled: true
      application_id: occupancy-demo
      window_ms: 400
      diagnostics_directory: results/aggregation
      # Private history supports spatial selection; output remains internal diagnostics.
      spatial_selection:
        min_depth: 1
        max_evaluations: 4096
      history:
        retention_ms: 2000
        max_bins: 32
        max_observations: 100000
        max_identity_bytes: 16000000
        max_buckets: 128
      policy_tree:
        id: occupancy-regions
        version: '1'
        max_nodes: 65536
        root:
          distinct_contributors: {min: 2}
          cell_side_m: {min: 1, max: 40}
          window_duration_ms: {max: 1000}
          age_at_evaluation_ms: {max: 1000}
        regions: [west, northeast]

# Legacy fields remain part of Region's configuration but do not supply metric rules.
region_taxonomy:
  - type: demo_residential
    color: green
    alpha: 0.1
    granularities:
      spatial: {min: 0, max: 1000}
      temporal: {min: 0, max: 10}
    privacy:
      k_anonymity: {min: 1}
      l_diversity: {min: 1}
    metric_requirements:
      distinct_contributors: {min: 5}
  - type: demo_traffic
    color: yellow
    alpha: 0.1
    granularities:
      spatial: {min: 0, max: 1000}
      temporal: {min: 0, max: 10}
    privacy:
      k_anonymity: {min: 1}
      l_diversity: {min: 1}
    metric_requirements:
      window_duration_ms: {max: 400}
regions:
  - id: west
    type: demo_residential
    area: {x: 0, y: 0, width: 40, height: 40}
    metric_requirements:
      distinct_contributors: {min: 2} # Cannot weaken the inherited minimum of 5.
  - id: northeast
    type: demo_traffic
    area: {x: 40, y: 0, width: 40, height: 40}
    metric_requirements:
      age_at_evaluation_ms: {max: 600}
# The southern half inherits only the root policy.
